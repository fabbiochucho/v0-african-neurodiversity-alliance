name: CI

on:
  pull_request:
  push:
    branches: [main]

# NOTE: Playwright/e2e specs (pnpm test:e2e, see playwright.config.ts) are
# intentionally NOT run here. Those tests hit a live Supabase project with
# seeded fixture data, and this repo has no Supabase project/secrets wired
# up in CI yet. Run them locally against a real project until that's set up.

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # These are placeholder values only, sufficient to satisfy build-time
    # env-var presence checks (e.g. lib/supabase/client.ts's non-null
    # assertions, and static prerendering of pages that read
    # process.env.NEXT_PUBLIC_* at build time). None of these are real
    # credentials — do not replace them with real secrets here; wire real
    # secrets through GitHub Environments/Secrets if this workflow ever needs
    # to talk to a live backend.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      FLUTTERWAVE_SECRET_KEY: placeholder-flutterwave-secret
      FLUTTERWAVE_SECRET_HASH: placeholder-flutterwave-hash
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: placeholder-resend-key
      RESEND_FROM_EMAIL: no-reply@example.com
      # Phase 1 cross-app federation placeholders (see lib/federation/).
      # Federation is opt-in and gated on NEXT_PUBLIC_NEURAFIKI_APP_URL being
      # set; the values below are dummy PEM-shaped strings, not real keys.
      NEXT_PUBLIC_NEURAFIKI_APP_URL: https://neurafiki.example.com
      FEDERATION_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nplaceholder\n-----END PRIVATE KEY-----\n"
      FEDERATION_NEURAFIKI_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nplaceholder\n-----END PUBLIC KEY-----\n"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build (runs lint via next build)
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run
