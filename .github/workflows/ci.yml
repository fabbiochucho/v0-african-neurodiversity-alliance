name: CI

on:
  pull_request:
  push:
    branches: [main]

# NOTE: the signed-in e2e specs run in the e2e-signed-in job below, against a
# throwaway local Supabase. iep-flow.spec.ts still needs a seeded account and
# is run locally only.

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Real credentials, pulled from this repo's GitHub Actions secrets
    # (Settings > Secrets and variables > Actions). These are the actual
    # production Supabase project, Flutterwave, Resend, and federation
    # values — CI only runs typecheck/build/unit tests against them (no e2e,
    # no live network calls), but treat this workflow file with the same
    # care as production config since real secrets flow through it.
    env:
      # Dependabot PRs don't receive Actions secrets; fall back to the public
      # (browser-shipped) Supabase URL and anon key so they can still build.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://exhgecucrtbzjrpnqtht.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4aGdlY3VjcnRiempycG5xdGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzOTg1OTMsImV4cCI6MjA5ODk3NDU5M30.dr0tndfJsw_wD7aMl4Kxs6DXC_CBjh8kH3uA9A36M1E' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
      FLUTTERWAVE_SECRET_HASH: ${{ secrets.FLUTTERWAVE_SECRET_HASH }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      # Phase 1 cross-app federation (see lib/federation/). Federation is
      # opt-in and gated on NEXT_PUBLIC_NEURAFIKI_APP_URL being set. The
      # federation keypair here is a CI-only pair, deliberately separate
      # from the real production keypair in Vercel, to limit blast radius
      # if these CI secrets ever leak — CI never performs a real handshake,
      # it only needs *a* validly-shaped key pair to satisfy build-time
      # parsing.
      NEXT_PUBLIC_NEURAFIKI_APP_URL: ${{ secrets.NEXT_PUBLIC_NEURAFIKI_APP_URL }}
      FEDERATION_PRIVATE_KEY: ${{ secrets.FEDERATION_PRIVATE_KEY }}
      FEDERATION_NEURAFIKI_PUBLIC_KEY: ${{ secrets.FEDERATION_NEURAFIKI_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build (runs lint via next build)
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Accessibility checks (axe on public pages)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          PLAYWRIGHT_BASE_URL=http://localhost:3000 pnpm exec playwright test tests/e2e/a11y.spec.ts

  # Signed-in journeys (tests/e2e/signed-in.spec.ts) against a throwaway local
  # Supabase built from scripts/*.sql. No production secrets reach this job.
  # Turnstile uses Cloudflare's always-pass test site key; local Supabase Auth
  # doesn't check CAPTCHA, so sign-up and sign-in work without a real token.
  e2e-signed-in:
    runs-on: ubuntu-latest
    env:
      E2E_LOCAL_SUPABASE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: |
          supabase init
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
          supabase status -o env | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' | tr -d '"' >> "$GITHUB_ENV"

      - name: Apply migrations
        run: |
          for f in scripts/*.sql; do
            echo "::group::$f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Build
        run: pnpm build

      - name: Signed-in tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          PLAYWRIGHT_BASE_URL=http://localhost:3000 pnpm exec playwright test tests/e2e/signed-in.spec.ts
